[package]
name = "tbg-pricing"
version = "0.1.0"
description = "TBG Pricing — local till-price comparison dashboard"
edition = "2021"
rust-version = "1.77"

[lib]
name = "tbg_pricing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
